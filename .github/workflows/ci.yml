name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref. Keeps PR pushes from stacking up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lean-action reads lean-toolchain, installs elan, restores the mathlib
      # olean cache (lake exe cache get), then runs lake build.
      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true

      # Type-check the downstream-consumption example against the built library.
      - name: Type-check examples
        run: lake env lean examples/EProcessTest.lean
